name: Release Windows build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish from the selected ref
        required: true
        default: v0.8-beta
        type: string
      source_ref:
        description: Git ref to build
        required: true
        default: main
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build Windows installers
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri installers
        run: pnpm tauri build

      - name: Create SHA-256 checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem -LiteralPath "src-tauri/target/release/bundle" -Recurse -File | Where-Object { $_.Extension -in '.msi', '.exe' }
          $lines = foreach ($file in $files) {
            $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $file.FullName).Hash
            "{0} *{1}" -f $hash, $file.Name
          }
          $lines | Set-Content -LiteralPath SHA256SUMS.txt -Encoding ascii

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: v0.8 beta
          generate_release_notes: true
          prerelease: true
          overwrite_files: true
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            SHA256SUMS.txt
